# QA criteria checklist, version 1.
# Each item says whether deterministic code (rule) or the QA agent checks it.
# Blocking items must pass before a supervisor can approve; warnings are shown
# to the reviewer but do not block.
version: "1.0.0"

thresholds:
  min_citation_coverage: 1.0     # share of claims that must carry a citation

items:
  # Completeness
  - id: required_sections_present
    description: Every required section for the assessment type is present.
    checked_by: rule
    tool: check_required_elements
    severity: blocking
  - id: required_elements_present
    description: Every required element in each section is addressed.
    checked_by: rule
    tool: check_required_elements
    severity: blocking
  - id: completed_by_due_date
    description: The assessment is completed by its due date (calendar or business days).
    checked_by: rule
    tool: calculate_due_date
    severity: warning

  # Accuracy and evidence
  - id: citation_coverage
    description: Every factual claim cites a source document and page.
    checked_by: rule
    tool: check_citation_coverage
    severity: blocking
  - id: citations_resolve
    description: Every citation points to a document in this case.
    checked_by: rule
    tool: validate_citations
    severity: blocking
  - id: claims_supported
    description: Each claim is supported by the text it cites.
    checked_by: agent
    severity: blocking
  - id: conflicts_named
    description: When sources conflict, the draft names the conflict and both sources instead of choosing one.
    checked_by: agent
    severity: blocking

  # Scope and safety
  - id: no_determinations
    description: The draft makes no eligibility, risk level, diagnosis or level of care determination.
    checked_by: rule
    tool: check_prohibited_language
    severity: blocking
  - id: safety_concerns_carried
    description: Safety concerns found in the records appear in the summary and are flagged for staff.
    checked_by: agent
    severity: blocking

  # Quality of writing
  - id: person_first_language
    description: Language is person first and non-stigmatizing.
    checked_by: agent
    severity: warning
  - id: strengths_included
    description: Strengths are described, not only needs or deficits.
    checked_by: agent
    severity: warning

# Phrases that signal a determination the AI must not make.
# Matched case-insensitively as whole phrases.
prohibited_phrases:
  - is eligible
  - is not eligible
  - is ineligible
  - does not qualify
  - qualifies for
  - meets criteria for
  - level of care is
  - recommend placement
  - risk level is
  - is high risk
  - is low risk
  - diagnosis is
