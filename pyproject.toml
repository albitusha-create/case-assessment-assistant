[project]
name = "case-assessment-assistant"
version = "0.1.0"
description = "Azure-native reference implementation: AI-assisted case assessment drafting with citations, QA checks and human approval."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "azure-identity>=1.27",
    "azure-storage-blob>=12.31",
    "azure-ai-documentintelligence>=1.0.2",
    "azure-search-documents>=12.1",
    "openai>=3.56",
]

[dependency-groups]
data = [
    "reportlab>=5.1.0",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caa"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["caa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import caa from src directly, so tests do not depend on the editable-install
# .pth file (which macOS can hide inside iCloud-synced folders).
pythonpath = ["src"]
markers = ["integration: needs real Azure resources; skipped in CI unit runs"]
addopts = "-m 'not integration'"
