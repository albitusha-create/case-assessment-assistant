name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest
      - name: Bicep build
        run: az bicep build --file infra/main.bicep --stdout > /dev/null
      - name: No em dashes in tracked files
        run: |
          # git grep only searches files in the repo, not .venv or caches.
          if git grep -n $'\xe2\x80\x94' -- '*.md' '*.py' '*.yml' '*.yaml' '*.bicep' '*.toml'; then
            echo "Em dash found. Replace it with a comma, colon or parentheses."; exit 1
          fi
